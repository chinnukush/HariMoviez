<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(s){s.dataset.zone='11456473',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Verification | Hari Moviez</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #050505;
    background: radial-gradient(circle at center, #14120f 0%, #050505 100%);
    overflow: hidden;
    position: relative;
}

/* Luxurious Black & Gold Ambient Glow Orbs */
body::before {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    background: #FFD700;
    border-radius: 50%;
    filter: blur(160px);
    top: -150px;
    left: -150px;
    opacity: 0.12;
    animation: floatOrb1 7s ease-in-out infinite alternate;
}

body::after {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    background: #D4AF37;
    border-radius: 50%;
    filter: blur(160px);
    bottom: -150px;
    right: -150px;
    opacity: 0.10;
    animation: floatOrb2 7s ease-in-out infinite alternate;
}

.card {
    position: relative;
    z-index: 5;
    width: 410px;
    background: rgba(15, 15, 15, 0.75);
    border: 1px solid rgba(212, 175, 55, 0.25);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 40px 30px;
    border-radius: 32px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 215, 0, 0.15);
}

/* ================= TIMER STYLE ================= */
.timer-container {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 20px auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

.timer-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, #FFD700, #D4AF37, rgba(212, 175, 55, 0.1), #FFD700);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 3s linear infinite;
}

.timer-inner {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(10, 10, 10, 0.9);
    border: 1px solid rgba(212, 175, 55, 0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
}

#timer {
    font-size: 38px;
    font-weight: 700;
    background: linear-gradient(180deg, #FFFFFF, #FFD700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
/* =================================================== */

.logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #FFF, #FFD700, #D4AF37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
}

h2 {
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
}

.status {
    color: #e6dfc2;
    font-size: 14px;
    font-weight: 400;
    min-height: 24px;
    margin-bottom: 20px;
}

.progress-bar-container {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #D4AF37, #FFD700);
    transform-origin: left;
    transition: transform 1s linear;
}

.features-badge {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.badge {
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(255, 215, 0, 0.06);
    border: 1px solid rgba(212, 175, 55, 0.25);
    color: #FFD700;
    font-weight: 500;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

@keyframes floatOrb1 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(35px, 35px); }
}

@keyframes floatOrb2 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-35px, -35px); }
}

@media(max-width: 430px) {
    .card { width: 90%; padding: 30px 20px; }
}
</style>
</head>

<body>

<div class="card" id="content-card">
    <div class="timer-container" id="timer-box">
        <div class="timer-ring"></div>
        <div class="timer-inner">
            <span id="timer">5</span>
        </div>
    </div>

    <div class="logo">ʜᴀʀɪ ᴍᴏᴠɪᴇZ</div>
    <h2 id="main-heading">Security Verification</h2>
    <div class="status" id="status-text">Redirecting in 5 seconds...</div>

    <div class="progress-bar-container" id="progress-box">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="features-badge" id="badge-box">
        <span class="badge">🛡️ Protected Link</span>
        <span class="badge">⚡ Anti-Bypass Guard</span>
    </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
    // --- BYPASS PROTECTION CHECK ---
    const isAuthorized = sessionStorage.getItem("authorized_access");

    const statusElement = document.getElementById("status-text");
    const timerBox = document.getElementById("timer-box");
    const mainHeading = document.getElementById("main-heading");
    const badgeBox = document.getElementById("badge-box");
    const progressBox = document.getElementById("progress-box");

    if (!isAuthorized) {
        mainHeading.textContent = "Access Denied";
        statusElement.textContent = "Direct access or link bypassing is strictly blocked!";
        statusElement.style.color = "#ff5c5c";
        timerBox.style.display = "none";
        badgeBox.style.display = "none";
        progressBox.style.display = "none";
        return;
    }

    // Clear token to prevent replay
    sessionStorage.removeItem("authorized_access");

    // --- DECODE LONG TOKEN PARAMETER ---
    const params = new URLSearchParams(window.location.search);
    const tokenParam = params.get("token");
    const timerElement = document.getElementById("timer");
    const progressBar = document.getElementById("progress");

    let decodedTargetUrl = "";

    if (tokenParam) {
        try {
            const jsonPayload = atob(decodeURIComponent(tokenParam));
            const parsedData = JSON.parse(jsonPayload);
            decodedTargetUrl = parsedData.url;
        } catch (e) {
            decodedTargetUrl = "";
        }
    }

    function isValidUrl(string) {
        try {
            const url = new URL(string);
            return url.protocol === "http:" || url.protocol === "https:";
        } catch (_) {
            return false;
        }
    }

    if (!decodedTargetUrl || !isValidUrl(decodedTargetUrl)) {
        mainHeading.textContent = "Configuration Error";
        statusElement.textContent = "Invalid or missing secure encryption token.";
        timerBox.style.display = "none";
        progressBox.style.display = "none";
        return;
    }

    let timeLeft = 5;
    timerElement.textContent = timeLeft;
    statusElement.textContent = `Redirecting in ${timeLeft} seconds...`;
    progressBar.style.transform = "scaleX(1)";

    const countdownInterval = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        statusElement.textContent = `Redirecting in ${timeLeft} seconds...`;
        
        const scaleFactor = timeLeft / 5;
        progressBar.style.transform = `scaleX(${scaleFactor})`;

        if (timeLeft <= 0) {
            clearInterval(countdownInterval);
            
            statusElement.textContent = "Verification successful! Click below to proceed.";
            const cardContainer = document.getElementById("content-card");
            
            timerBox.style.display = "none";
            progressBox.style.display = "none";
            badgeBox.style.display = "none";
            
            const proceedBtn = document.createElement("a");
            proceedBtn.href = decodedTargetUrl;
            proceedBtn.textContent = "Proceed to Destination ➔";
            proceedBtn.style.cssText = `
                display: inline-block;
                margin-top: 10px;
                padding: 14px 28px;
                background: linear-gradient(135deg, #FFD700, #D4AF37);
                color: #000000;
                font-weight: 700;
                text-decoration: none;
                border-radius: 50px;
                box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
                transition: all 0.3s ease;
            `;
            
            cardContainer.appendChild(proceedBtn);
        }
    }, 1000);
});
</script>
</body>
</html>
