<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparing Your Download...</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #050505, #121212, #1c1917);
    overflow: hidden;
    position: relative;
}

/* Ambient Background Glows */
body::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    background: #FFD700;
    border-radius: 50%;
    filter: blur(200px);
    top: -180px;
    left: -180px;
    opacity: 0.12;
    animation: float1 8s ease-in-out infinite;
}

body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: #D4AF37;
    border-radius: 50%;
    filter: blur(200px);
    bottom: -180px;
    right: -180px;
    opacity: 0.12;
    animation: float2 8s ease-in-out infinite;
}

.card {
    position: relative;
    z-index: 5;
    width: 380px;
    background: rgba(18, 18, 18, 0.95);
    border: 1px solid rgba(212, 175, 55, 0.25);
    backdrop-filter: blur(20px);
    padding: 35px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.05);
}

/* ================= NEW TIMER STYLE ================= */
.timer-container {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Outer Pulsing Glow Ring */
.timer-container::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
    animation: pulse 2s ease-in-out infinite alternate;
}

/* Rotating Gradient Ring Arc */
.timer-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, #FFD700, #D4AF37, transparent 60%, #FFD700);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 2.5s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
}

/* Inner Solid Core */
.timer-inner {
    width: 106px;
    height: 106px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #181818, #080808);
    border: 1px solid rgba(212, 175, 55, 0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    z-index: 2;
}

#timer {
    font-size: 40px;
    font-weight: 700;
    background: linear-gradient(180deg, #FFFFFF, #FFD700, #D4AF37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
}
/* =================================================== */

.logo {
    margin-top: 20px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #FFF, #FFD700, #D4AF37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

h2 {
    margin-top: 10px;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
}

.status {
    margin-top: 14px;
    color: #D4AF37;
    font-size: 15px;
    font-weight: 500;
    min-height: 24px;
}

/* Math CAPTCHA UI */
.captcha-box {
    display: none;
    margin-top: 20px;
    padding: 18px;
    background: rgba(255, 215, 0, 0.03);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 16px;
}

.captcha-question {
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
}

.captcha-input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(212, 175, 55, 0.4);
    background: #000;
    color: #FFD700;
    font-size: 16px;
    text-align: center;
    outline: none;
    font-weight: 600;
}

.captcha-input:focus {
    border-color: #FFD700;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
}

.error-msg {
    color: #FF4D4D;
    font-size: 13px;
    margin-top: 8px;
    display: none;
}

.bot {
    margin-top: 20px;
    display: inline-block;
    padding: 8px 20px;
    border-radius: 50px;
    background: rgba(255, 215, 0, 0.08);
    border: 1px solid rgba(255, 215, 0, 0.2);
    color: #FFD700;
    font-weight: 600;
    font-size: 13px;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #FFD700, #D4AF37, #AA771C);
    color: #000;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

@keyframes pulse {
    0% { transform: scale(0.96); opacity: 0.5; }
    100% { transform: scale(1.04); opacity: 0.9; }
}

@keyframes float1 {
    50% { transform: translate(40px, 20px); }
}

@keyframes float2 {
    50% { transform: translate(-40px, -20px); }
}

@media(max-width: 430px) {
    .card { width: 92%; padding: 25px; }
}
</style>
</head>

<body>

<div class="card">
    <div class="timer-container">
        <div class="timer-ring"></div>
        <div class="timer-inner">
            <span id="timer">3</span>
        </div>
    </div>

    <div class="logo">ʜᴀʀɪ ᴍᴏᴠɪᴇᴢ</div>

    <h2 id="main-heading">Security Verification</h2>

    <div class="status" id="status-text">Checking connection...</div>

    <!-- Math CAPTCHA Container -->
    <div class="captcha-box" id="captcha-box">
        <div class="captcha-question" id="captcha-question">Solve: 0 + 0 = ?</div>
        <input type="number" class="captcha-input" id="captcha-answer" placeholder="Enter answer" autocomplete="off">
        <div class="error-msg" id="error-msg">Incorrect answer. Try again!</div>
        <button id="verify-btn" onclick="verifyCaptcha()">Verify Human</button>
    </div>

    <div class="bot">
        ⚡ Hari Moviez
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect");

let currentNum1 = 0;
let currentNum2 = 0;
let correctAnswer = 0;

// Step 1: 1–3s "Checking connection..."
let step1Time = 3;
const step1Interval = setInterval(() => {
    step1Time--;
    document.getElementById("timer").textContent = step1Time;
    
    if (step1Time <= 0) {
        clearInterval(step1Interval);
        startStep2();
    }
}, 1000);

// Step 2: 4–6s "Verifying human..." + Show CAPTCHA & Verify Button
function startStep2() {
    document.getElementById("status-text").textContent = "Verifying human...";
    let step2Time = 3; 
    document.getElementById("timer").textContent = step2Time;

    const step2Interval = setInterval(() => {
        step2Time--;
        document.getElementById("timer").textContent = step2Time;

        if (step2Time <= 0) {
            clearInterval(step2Interval);
            showCaptcha();
        }
    }, 1000);
}

function generateCaptcha() {
    currentNum1 = Math.floor(Math.random() * 10) + 1;
    currentNum2 = Math.floor(Math.random() * 10) + 1;
    correctAnswer = currentNum1 + currentNum2;
    document.getElementById("captcha-question").textContent = `Solve: ${currentNum1} + ${currentNum2} = ?`;
}

function showCaptcha() {
    generateCaptcha();
    document.getElementById("captcha-box").style.display = "block";
    document.getElementById("timer").textContent = "✓";
}

// CAPTCHA Logic
function verifyCaptcha() {
    const userAnswer = parseInt(document.getElementById("captcha-answer").value, 10);
    const errorMsg = document.getElementById("error-msg");

    if (userAnswer === correctAnswer) {
        errorMsg.style.display = "none";
        document.getElementById("captcha-box").style.display = "none";
        startFinalRedirectCountdown();
    } else {
        errorMsg.style.display = "block";
        document.getElementById("captcha-answer").value = "";
        generateCaptcha();
    }
}

// Step 3: Correct answer -> 7–10s "Redirecting..."
function startFinalRedirectCountdown() {
    let finalSeconds = Math.floor(Math.random() * 4) + 7; 
    
    document.getElementById("status-text").textContent = "Redirecting...";
    document.getElementById("timer").textContent = finalSeconds;

    const redirectInterval = setInterval(() => {
        finalSeconds--;
        document.getElementById("timer").textContent = finalSeconds;

        if (finalSeconds <= 0) {
            clearInterval(redirectInterval);
            if (redirect) {
                window.location.href = decodeURIComponent(redirect);
            } else {
                document.getElementById("status-text").textContent = "Verification complete!";
            }
        }
    }, 1000);
}
</script>
</body>
</html>
