<meta charset="UTF-8">

<title>Preparing Your Download...</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #050505, #121212, #1c1917);
    overflow: hidden;
    position: relative;
}

/* Ambient Background Glows */
body::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    background: #FFD700;
    border-radius: 50%;
    filter: blur(200px);
    top: -180px;
    left: -180px;
    opacity: 0.12;
    animation: float1 8s ease-in-out infinite;
}

body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: #D4AF37;
    border-radius: 50%;
    filter: blur(200px);
    bottom: -180px;
    right: -180px;
    opacity: 0.12;
    animation: float2 8s ease-in-out infinite;
}

.card {
    position: relative;
    z-index: 5;
    width: 380px;
    background: rgba(18, 18, 18, 0.95);
    border: 1px solid rgba(212, 175, 55, 0.25);
    backdrop-filter: blur(20px);
    padding: 35px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.05);
}

/* ================= TIMER STYLE ================= */
.timer-container {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

.timer-container::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
    animation: pulse 2s ease-in-out infinite alternate;
}

.timer-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, #FFD700, #D4AF37, transparent 60%, #FFD700);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 2.5s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
}

.timer-inner {
    width: 106px;
    height: 106px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #181818, #080808);
    border: 1px solid rgba(212, 175, 55, 0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    z-index: 2;
}

#timer {
    font-size: 40px;
    font-weight: 700;
    background: linear-gradient(180deg, #FFFFFF, #FFD700, #D4AF37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
}
/* =================================================== */

.logo {
    margin-top: 20px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #FFF, #FFD700, #D4AF37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

h2 {
    margin-top: 10px;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
}

.status {
    margin-top: 14px;
    color: #D4AF37;
    font-size: 15px;
    font-weight: 500;
    min-height: 24px;
}

.bot {
    margin-top: 20px;
    display: inline-block;
    padding: 8px 20px;
    border-radius: 50px;
    background: rgba(255, 215, 0, 0.08);
    border: 1px solid rgba(255, 215, 0, 0.2);
    color: #FFD700;
    font-weight: 600;
    font-size: 13px;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

@keyframes pulse {
    0% { transform: scale(0.96); opacity: 0.5; }
    100% { transform: scale(1.04); opacity: 0.9; }
}

@keyframes float1 {
    50% { transform: translate(40px, 20px); }
}

@keyframes float2 {
    50% { transform: translate(-40px, -20px); }
}

@media(max-width: 430px) {
    .card { width: 92%; padding: 25px; }
}
</style>

<body>

<div class="card">
    <div class="timer-container">
        <div class="timer-ring"></div>
        <div class="timer-inner">
            <span id="timer">5</span>
        </div>
    </div>

    <div class="logo">ʜᴀʀɪ ᴍᴏᴠɪᴇᴢ</div>

    <h2 id="main-heading">Security Verification</h2>

    <div class="status" id="status-text">Redirecting in progress...</div>

    <div class="bot">
        ⚡ Hari Moviez
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const tokenParam = params.get("token");
const redirectParam = params.get("redirect"); // Fallback support for old links

let decodedTargetUrl = "";

// 1. Decode the secure long Base64 token parameter if present
if (tokenParam) {
    try {
        const jsonPayload = atob(decodeURIComponent(tokenParam));
        const parsedData = JSON.parse(jsonPayload);
        decodedTargetUrl = parsedData.url;
    } catch (e) {
        decodedTargetUrl = "";
    }
} else if (redirectParam) {
    // Fallback for standard redirect links
    decodedTargetUrl = decodeURIComponent(redirectParam);
}

// 2. Direct 5-second countdown timer
let timeLeft = 5;
const timerElement = document.getElementById("timer");
const statusElement = document.getElementById("status-text");

timerElement.textContent = timeLeft;

const countdownInterval = setInterval(() => {
    timeLeft--;
    timerElement.textContent = timeLeft;

    if (timeLeft <= 0) {
        clearInterval(countdownInterval);
        if (decodedTargetUrl) {
            window.location.href = decodedTargetUrl;
        } else {
            statusElement.textContent = "Invalid or missing secure link!";
        }
    }
}, 1000);
</script>
