<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(s){s.dataset.zone='11456473',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparing Your Download...</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#09090b,#18181b,#27272a);
overflow:hidden;
position:relative;
}

/* Animated Background */

body::before{
content:"";
position:absolute;
width:450px;
height:450px;
background:#facc15;
border-radius:50%;
filter:blur(180px);
top:-180px;
left:-180px;
opacity:.18;
animation:float1 8s ease-in-out infinite;
}

body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:#fb923c;
border-radius:50%;
filter:blur(180px);
bottom:-180px;
right:-180px;
opacity:.18;
animation:float2 8s ease-in-out infinite;
}

.card{
position:relative;
z-index:5;
width:370px;
background:rgba(20,20,20,.92);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:35px;
border-radius:28px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.timer-ring{
width:125px;
height:125px;
margin:auto;
border-radius:50%;
padding:6px;
background:linear-gradient(135deg,#FFD700,#FFB800,#ff9800,#FFD700);
animation:rotate 3s linear infinite;
}

.timer-inner{
width:100%;
height:100%;
border-radius:50%;
background:#101010;
display:flex;
justify-content:center;
align-items:center;
}

#timer{
font-size:50px;
font-weight:700;
color:#FFD700;
}

.logo{
margin-top:20px;
font-size:30px;
}

h2{
margin-top:18px;
color:#fff;
font-size:25px;
font-weight:600;
}

p{
margin-top:12px;
color:#cfcfcf;
font-size:15px;
line-height:24px;
}

.progress{
margin-top:22px;
height:8px;
background:#2f2f2f;
border-radius:30px;
overflow:hidden;
}

.progress div{
height:100%;
width:100%;
background:linear-gradient(90deg,#FFD700,#FF9800);
animation:progress 5s linear forwards;
}

.status{
margin-top:18px;
color:#d5d5d5;
font-size:14px;
}

#sec{
color:#FFD700;
font-weight:bold;
}

.bot{
margin-top:20px;
display:inline-block;
padding:10px 22px;
border-radius:50px;
background:rgba(255,215,0,.12);
border:1px solid rgba(255,215,0,.2);
color:#FFD700;
font-weight:600;
}

button{
margin-top:28px;
width:100%;
padding:15px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#FFD700,#ff9800);
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 0 20px rgba(255,215,0,.3);
}

@keyframes rotate{
100%{
transform:rotate(360deg);
}
}

@keyframes progress{
from{
width:100%;
}
to{
width:0%;
}
}

@keyframes float1{
50%{
transform:translate(40px,20px);
}
}

@keyframes float2{
50%{
transform:translate(-40px,-20px);
}
}

@media(max-width:430px){

.card{
width:92%;
padding:30px;
}

.timer-ring{
width:110px;
height:110px;
}

#timer{
font-size:42px;
}

}

</style>
</head>

<body>

<div class="card">

<div class="timer-ring">
<div class="timer-inner">
<span id="timer">5</span>
</div>
</div>

<div class="logo">ʜᴀʀɪ ᴍᴏᴠɪᴇᴢ</div>

<h2>Preparing Your Download</h2>

<p>
Please wait while we generate your secure download link.
</p>

<div class="progress">
<div></div>
</div>

<div class="status">
Redirecting in <span id="sec">5</span> seconds...
</div>

<div class="bot">
⚡ Hari Moviez
</div>

<button onclick="closePage()">
✕ Close Page
</button>

</div>

<script>

function closePage(){
window.close();
}

const params=new URLSearchParams(window.location.search);
const redirect=params.get("redirect");

let count=5;

const interval=setInterval(()=>{

count--;

document.getElementById("timer").textContent=count;
document.getElementById("sec").textContent=count;

if(count<=0){

clearInterval(interval);

if(redirect){

window.location.href=decodeURIComponent(redirect);

}

}

},1000);

</script>
</body>
</html>
