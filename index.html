<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d0f18">
<title>Preparing Your Download Link...</title>
<style>
  :root { --ink:#ffffff; --ink2:#cbd5e1; --cyan:#06b6d4; --magenta:#ec4899; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { min-height:100vh; min-height:100dvh; display:flex; padding:24px; color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
         background:
           radial-gradient(60vmax 60vmax at 10% 6%, rgba(6,182,212,.35), rgba(0,0,0,0) 60%),
           radial-gradient(55vmax 55vmax at 94% 16%, rgba(236,72,153,.35), rgba(0,0,0,0) 62%),
           radial-gradient(70vmax 70vmax at 80% 100%, rgba(139,92,246,.30), rgba(0,0,0,0) 60%),
           linear-gradient(135deg,#090d16 0%,#111827 50%,#06080e 100%); }

  /* static remix colour shapes behind the glass */
  .shape { position:fixed; border-radius:50%; pointer-events:none; }
  .s1 { width:240px; height:240px; left:max(-60px,calc(50% - 330px)); top:8%;
        background:linear-gradient(145deg,#06b6d4,#3b82f6); box-shadow:0 30px 60px -20px rgba(6,182,212,.5); }
  .s2 { width:300px; height:300px; right:max(-90px,calc(50% - 400px)); bottom:5%;
        background:linear-gradient(145deg,#ec4899,#8b5cf6 55%,#06b6d4); box-shadow:0 30px 70px -24px rgba(236,72,153,.5); }
  .s3 { width:96px; height:96px; right:max(8px,calc(50% - 240px)); top:7%;
        background:linear-gradient(145deg,#f59e0b,#ec4899); box-shadow:0 18px 36px -14px rgba(245,158,11,.4); }

  /* ---- the glass card ---- */
  .card { position:relative; z-index:2; width:100%; max-width:392px; margin:auto; padding:32px 24px 24px;
          text-align:center; border-radius:34px;
          background:linear-gradient(160deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.04) 100%);
          border:1px solid rgba(255,255,255,.18);
          -webkit-backdrop-filter:blur(30px) saturate(190%); backdrop-filter:blur(30px) saturate(190%);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.6),
                     0 28px 60px -14px rgba(0,0,0,.8), 0 8px 22px -10px rgba(0,0,0,.6);
          animation:rise .7s cubic-bezier(.22,1,.36,1) both; }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    .card { background:rgba(17,24,39,.95); } }
  .card::before { content:""; position:absolute; top:0;right:0;bottom:0;left:0; border-radius:inherit; padding:1px; pointer-events:none;
          background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,.05) 38%,rgba(255,255,255,.15));
          -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0); }
  .card::after { content:""; position:absolute; left:0; right:0; top:0; height:48%; pointer-events:none;
          border-radius:34px 34px 0 0;
          background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0)); }
  .card > * { position:relative; z-index:1; }
  @keyframes rise { from { opacity:0; transform:translateY(18px) scale(.985); } }

  .logo-wrap { width:88px; height:88px; margin:0 auto 14px; padding:3px; border-radius:50%;
               background:linear-gradient(145deg,rgba(6,182,212,.4),rgba(236,72,153,.2));
               box-shadow:0 12px 28px -8px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.25); }
  .logo, .fb { width:100%; height:100%; border-radius:50%; object-fit:contain; background:#000; display:block; }
  .fb { display:none; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:#fff; letter-spacing:-1px; }

  .brand { margin:0; font-size:23px; font-weight:700; letter-spacing:-.02em; color:#ffffff; text-shadow:0 2px 4px rgba(0,0,0,.4); }
  .badge { display:inline-flex; align-items:center; gap:7px; margin:10px 0 0; padding:6px 12px; border-radius:99px;
           font-size:12px; font-weight:600; color:#38bdf8; background:rgba(6,182,212,.15);
           box-shadow:inset 0 0 0 1px rgba(56,189,248,.35), 0 4px 12px -6px rgba(6,182,212,.5); }
  .badge i { width:7px; height:7px; border-radius:50%; background:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,.25); }

  /* ---- timer: spinning rings + glass orb whose water rises with the countdown ---- */
  .timer { position:relative; width:164px; height:164px; margin:22px auto 20px; }
  .tr1, .tr2, .tpg { position:absolute; top:0;right:0;bottom:0;left:0; }
  .tr1 svg, .tr2 svg, .tpg svg { width:100%; height:100%; display:block; overflow:visible; }
  .tr1 { animation:spin 6s linear infinite; }
  .tr2 { animation:spin 16s linear infinite reverse; }
  .tpg { transform:rotate(-90deg); }
  .pgc { fill:none; stroke-width:6; }
  .pgc.t { stroke:rgba(6,182,212,.2); }
  .pgc.p { stroke:url(#gp); stroke-linecap:round; stroke-dasharray:414.69; stroke-dashoffset:414.69; }
  .run .pgc.p { animation:dash 5s linear forwards; }
  @keyframes dash { to { stroke-dashoffset:0; } }

  .orb { position:absolute; top:24px;right:24px;bottom:24px;left:24px; border-radius:50%; overflow:hidden; isolation:isolate;
         -webkit-mask-image:-webkit-radial-gradient(white,black);
         background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.2),rgba(255,255,255,.05) 42%,rgba(10,15,30,.85));
         box-shadow:0 14px 28px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.2); }
  .liquid { position:absolute; left:0; right:0; top:0; height:200%; transform:translateY(50%); will-change:transform; }
  .run .liquid { animation:fill 5s linear forwards; }
  @keyframes fill { from { transform:translateY(50%); } to { transform:translateY(-6%); } }
  .wv { position:absolute; left:0; top:0; width:200%; height:7%; display:block; will-change:transform; }
  .wf { fill:#06b6d4; animation:slide 3.2s linear infinite; }
  .wb { fill:#67e8f9; top:-1.4%; animation:slide 5.4s linear infinite reverse; }
  @keyframes slide { to { transform:translateX(-50%); } }
  .body { position:absolute; left:0; right:0; top:6.3%; bottom:0; background:linear-gradient(180deg,#06b6d4,#3b82f6); }
  .orb::before { content:""; position:absolute; top:0;right:0;bottom:0;left:0; border-radius:50%; z-index:3; pointer-events:none;
         box-shadow:inset 0 -14px 26px rgba(0,0,0,.4), inset 0 10px 20px rgba(255,255,255,.3); }
  .orb::after { content:""; position:absolute; top:7%; left:14%; width:44%; height:24%; border-radius:50%; z-index:3;
         background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)); transform:rotate(-24deg); pointer-events:none; }
  .num { position:absolute; top:0;right:0;bottom:0;left:0; z-index:4; display:flex; align-items:center; justify-content:center;
         font-size:46px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
         color:#ffffff; text-shadow:0 2px 6px rgba(0,0,0,.7); }
  .num.pop { animation:pop .38s cubic-bezier(.22,1,.36,1); }
  @keyframes pop { from { transform:scale(.8); opacity:.2; } to { transform:none; opacity:1; } }

  h2 { margin:0 0 5px; font-size:19px; font-weight:650; letter-spacing:-.015em; color:#ffffff; }
  .sub { margin:0 0 22px; font-size:14px; color:#cbd5e1; font-weight:500; }

  /* ---- buttons ---- */
  .btn { display:flex; align-items:center; justify-content:center; gap:9px; width:100%; height:54px;
         border:0; border-radius:18px; font-family:inherit; font-size:16.5px; font-weight:600; letter-spacing:-.01em;
         color:#ffffff; text-decoration:none; cursor:pointer;
         background:linear-gradient(180deg,#06b6d4 0%,#2563eb 100%);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.3),
                    0 14px 26px -10px rgba(6,182,212,.6);
         transition:transform .18s cubic-bezier(.22,1,.36,1), opacity .4s ease; }
  .btn:active { transform:scale(.97); }
  .btn.wait { opacity:.55; pointer-events:none; }
  .btn.ready { animation:pop .4s cubic-bezier(.22,1,.36,1); }
  .spin { width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4);
          border-top-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ghost { margin-top:10px; color:#ffffff; background:rgba(255,255,255,.1);
           box-shadow:inset 0 0 0 1px rgba(255,255,255,.2), inset 0 1px 0 rgba(255,255,255,.25), 0 8px 20px -10px rgba(0,0,0,.5); }
  .ghost svg { fill:#38bdf8; }

  .foot { margin-top:18px; font-size:12.5px; color:#94a3b8; letter-spacing:.2px; font-weight:500; }

  @media (max-width:380px) { body { padding:16px; } .card { padding:26px 18px 20px; } }
  @media (max-height:640px) { .s1, .s2, .s3 { display:none; } }
  @media (prefers-reduced-motion:reduce) { .card, .num.pop, .btn.ready, .spin, .tr1, .tr2, .wf, .wb { animation:none; } }
</style>
</head>
<body>
  <div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div>

  <main class="card" id="card">
    <div class="logo-wrap">
      <img class="logo" src="https://iili.io/nWD8HYB.jpg" alt="Hari Moviez"
           onerror="this.style.display='none';document.getElementById('fb').style.display='flex'">
      <div class="fb" id="fb">HM</div>
    </div>
    <h1 class="brand">ʜᴀʀɪ ᴍᴏᴠɪᴇᴢ</h1>
    <div class="badge"><i></i> Secured &amp; verified link</div>

    <div class="timer">
      <div class="tr1"><svg viewBox="0 0 164 164"><defs>
        <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
        <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
        <circle cx="82" cy="82" r="79" fill="none" stroke="url(#ga)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="190 306.4"/></svg></div>
      <div class="tr2"><svg viewBox="0 0 164 164">
        <circle cx="82" cy="82" r="73" fill="none" stroke="rgba(56,189,248,.40)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1.5 7.5"/></svg></div>
      <div class="tpg"><svg viewBox="0 0 164 164">
        <circle class="pgc t" cx="82" cy="82" r="66"></circle>
        <circle class="pgc p" cx="82" cy="82" r="66"></circle></svg></div>
      <div class="orb">
        <div class="liquid">
          <div class="body"></div>
          <svg class="wv wb" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q25 0 50 10 T100 10 T150 10 T200 10 V20 H0 Z"/></svg>
          <svg class="wv wf" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q25 0 50 10 T100 10 T150 10 T200 10 V20 H0 Z"/></svg>
        </div>
      </div>
      <div class="num" id="n">5</div>
    </div>

    <h2>ꜱᴇᴄᴜʀɪᴛʏ ᴠᴇʀɪғɪᴄᴀᴛɪᴏɴ</h2>
    <p class="sub" id="status-text">ꜱᴄᴀɴɴɪɴɢ ʟɪɴᴋ...</p>

    <a class="btn wait" id="go" href="#" rel="noreferrer"><span class="spin" id="sp"></span><span id="gt">ᴠᴇʀɪғʏɪɴɢ…</span></a>
    <a class="btn ghost" href="https://t.me/hari_moviez" target="_blank" rel="noopener noreferrer"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>Hari Moviez Bot ⚡</a>

    <div class="foot">⚡ ʜᴀʀɪ ᴍᴏᴠɪᴇᴢ ꜱᴇᴄᴜʀɪᴛʏ</div>
  </main>

<script>
  function getTargetUrl() {
    const path = window.location.pathname;
    const searchParams = new URLSearchParams(window.location.search);
    
    const pathParts = path.split('/').filter(Boolean);
    let rawToken = "";
    
    const tokenIndex = pathParts.indexOf("token");
    if (tokenIndex !== -1 && pathParts.length > tokenIndex + 2) {
        rawToken = pathParts[tokenIndex + 2];
    } else if (pathParts.length > 0) {
        rawToken = pathParts[pathParts.length - 1];
    }

    if (!rawToken || rawToken === "index.html") {
        rawToken = searchParams.get("token") || searchParams.get("redirect");
    }

    if (!rawToken) return null;

    try {
        let base64 = rawToken.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) {
            base64 += '=';
        }
        
        const decodedJson = atob(base64);
        const parsed = JSON.parse(decodedJson);
        return parsed.url || null;
    } catch (e) {
        try {
            return decodeURIComponent(rawToken);
        } catch (_) {
            return null;
        }
    }
  }

  const decodedTargetUrl = getTargetUrl();
  const statusElement = document.getElementById("status-text");
  const goBtn = document.getElementById("go");

  if (!decodedTargetUrl || !(decodedTargetUrl.startsWith("http://") || decodedTargetUrl.startsWith("https://"))) {
      statusElement.textContent = "Invalid or missing secure token!";
      document.getElementById("gt").textContent = "Invalid Link";
      document.getElementById("sp").style.display = "none";
      throw new Error("Invalid URL");
  }

  goBtn.href = decodedTargetUrl;

  document.getElementById("card").classList.add("run");

  let timeLeft = 5;
  const numEl = document.getElementById("n");
  const gtEl = document.getElementById("gt");
  const spEl = document.getElementById("sp");

  numEl.textContent = timeLeft;

  const countdown = setInterval(() => {
    timeLeft--;
    
    if (timeLeft >= 0) {
      numEl.textContent = timeLeft;
      numEl.classList.remove("pop");
      void numEl.offsetWidth;
      numEl.classList.add("pop");

      if (timeLeft <= 2) {
        statusElement.textContent = "Redirecting in progress...";
      } else {
        statusElement.textContent = "Scanning Link...";
      }
    }

    if (timeLeft <= 0) {
      clearInterval(countdown);
      numEl.textContent = "0";
      statusElement.textContent = "Redirecting...";
      goBtn.className = "btn ready";
      spEl.style.display = "none";
      gtEl.textContent = "Proceed to Destination \u2192";
      
      setTimeout(() => {
          window.location.href = decodedTargetUrl;
      }, 300);
    }
  }, 1000);
</script>
</body>
</html>
